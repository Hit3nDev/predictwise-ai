<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Typefaces are served from /fonts (see index.css), so the app needs no third-party request. -->
    <link rel="preload" href="/fonts/bricolage-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/splinemono-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>PredictWise</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101012" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Apply the saved theme before the first paint so the page never flashes the other one. -->
    <script>try { var t = localStorage.getItem("pw-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
