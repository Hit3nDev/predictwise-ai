# docker compose up --build   ->   http://localhost:8000
services:
  predictwise:
    build: .
    ports: ["8000:8000"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}          # optional: free key from console.groq.com
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - predictwise-data:/data
    restart: unless-stopped
volumes:
  predictwise-data:
